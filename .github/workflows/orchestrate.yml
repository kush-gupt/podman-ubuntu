# Orchestrator: fan out the component build DAG over the full matrix,
# smoke-test the result, then publish the signed apt repository.
# Triggered by merging a watch PR (or a packaging change).
name: orchestrate

# Only one orchestrate runs at a time; a new push cancels the in-progress run.
concurrency:
  group: orchestrate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "versions.json"
      - "components.json"
      - "ubuntu-versions.json"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/orchestrate.yml"
  # PRs run the same build+smoke matrix against themselves so packaging
  # changes are validated before merge. The publish job is gated to pushes
  # below: PRs never touch the apt-repo branch, Pages, or main's manifest.
  pull_request:
    branches: [main]
    paths:
      - "versions.json"
      - "components.json"
      - "ubuntu-versions.json"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/orchestrate.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild even if manifest says published"
        type: boolean
        default: false

permissions:
  contents: write # publish job pushes the apt-repo branch
  pages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      level0: ${{ steps.matrix.outputs.level0 }}
      level1: ${{ steps.matrix.outputs.level1 }}
      suites: ${{ steps.matrix.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: matrix
        run: python3 scripts/build_matrix.py
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}

  level0:
    needs: setup
    if: needs.setup.outputs.level0 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.level0) }}
    uses: ./.github/workflows/build.yml
    with:
      component: ${{ matrix.component }}
      version: ${{ matrix.version }}
      ubuntu_version: ${{ matrix.ubuntu_version }}
      arch: ${{ matrix.arch }}
      track: ${{ matrix.track }}
      extra: ${{ matrix.extra }}

  level1:
    needs: [setup, level0]
    if: needs.setup.outputs.level1 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.level1) }}
    uses: ./.github/workflows/build.yml
    with:
      component: ${{ matrix.component }}
      version: ${{ matrix.version }}
      ubuntu_version: ${{ matrix.ubuntu_version }}
      arch: ${{ matrix.arch }}
      track: ${{ matrix.track }}
      extra: ${{ matrix.extra }}

  smoke:
    needs: [setup, level0, level1]
    # Run if either build level produced artifacts (level1 is skipped when
    # only level0 components rebuilt, but we still need to smoke-test and
    # publish those).
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.level0.result == 'success' || needs.level1.result == 'success')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ${{ fromJSON(needs.setup.outputs.suites).ubuntu }}
        track: ${{ fromJSON(needs.setup.outputs.suites).tracks }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.ubuntu_version }}
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: debs-*
          path: debs
      - name: Install this cell's debs
        # Selects artifacts via their meta.json sidecars (written by
        # build.yml); installs with apt so deps resolve in one step.
        # python3 isn't in the minimal ubuntu container image, so install
        # it first (install_debs.py itself also runs apt-get update).
        # The published repo is a fallback source: incremental builds only
        # produce artifacts for changed components, so unchanged packages
        # (e.g. podman itself) resolve from the repo, not the artifacts.
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 ca-certificates curl
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://kush-gupt.github.io/podman-ubuntu/keys/apt-signing.asc -o /etc/apt/keyrings/podman-ubuntu.asc
          chmod 644 /etc/apt/keyrings/podman-ubuntu.asc
          # Suite names omit the dot: v5-2404, not v5-24.04.
          SUITE="${{ matrix.track }}-$(echo '${{ matrix.ubuntu_version }}' | tr -d .)"
          printf 'Types: deb\nURIs: https://kush-gupt.github.io/podman-ubuntu\nSuites: %s\nComponents: main\nSigned-By: /etc/apt/keyrings/podman-ubuntu.asc\n' "$SUITE" > /etc/apt/sources.list.d/podman-ubuntu.sources
          # Pin our repo above Ubuntu's: Ubuntu 26.04 ships aardvark-dns
          # 1.16.0-3 which outranks our 1.16.0-1~resolute (the ~ sorts lower),
          # but Ubuntu's installs to a different path. Prefer ours.
          printf 'Package: *\nPin: origin kush-gupt.github.io\nPin-Priority: 900\n' > /etc/apt/preferences.d/podman-ubuntu
          python3 scripts/install_debs.py "${{ matrix.track }}" "${{ matrix.ubuntu_version }}"
      - run: |
          # Every binary in the stack reports a version. netavark and
          # aardvark-dns live in libexec, not PATH.
          podman --version
          conmon --version
          crun --version
          /usr/libexec/podman/netavark --version
          /usr/libexec/podman/aardvark-dns --version
          command -v passt
          # Actually run a container: exercises podman + crun + conmon +
          # netavark end to end. vfs storage driver for reliability inside
          # this nested container; --privileged on the job container
          # allows the clone/mount syscalls podman needs. --cgroups=disabled
          # because cgroup v2 controller delegation does not work inside
          # GitHub's nested job containers (not a packaging issue).
          podman --storage-driver=vfs info --format '{{.Host.Arch}} {{.Version.Version}}'
          podman --storage-driver=vfs run --cgroups=disabled --rm docker.io/library/alpine:latest echo "hello from podman ${{ matrix.track }}"

  publish:
    needs: [setup, smoke]
    # Publishing mutates the apt-repo branch, the Pages deployment, and
    # main's manifest: only pushes to main may do that. PR runs stop after
    # smoke. The explicit always() is needed because GitHub sometimes skips
    # publish even when all smoke jobs succeed (matrix + if: interaction).
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.setup.result == 'success' &&
      needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: debs-*
          path: debs
      - name: Install reprepro
        run: sudo apt-get update -qq && sudo apt-get install -y -qq reprepro
      - name: Assemble, sign and prune the apt repository
        env:
          APT_SIGNING_SUBKEY: ${{ secrets.APT_SIGNING_SUBKEY }}
          TRACKS: ${{ join(fromJSON(needs.setup.outputs.suites).tracks, ',') }}
        run: python3 scripts/publish_repo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo-publish
      - id: deployment
        uses: actions/deploy-pages@v4
