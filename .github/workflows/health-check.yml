# Daily check of the LIVE published apt repository, independent of
# any publish run. verify-published (orchestrate) only exercises the
# repo right after a publish; this catches a Pages / reprepro /
# signing regression that lands between releases, the failure mode
# that once left every amd64 index holding 2 of 8 packages unnoticed.
#
# Failures surface through ci-failure-alert (this workflow is in its
# workflow_run list), which reruns once and then opens a ci-failure
# issue. The key-expiry job additionally files its own issue ahead of
# the signing subkey's expiry (see scripts/check_key_expiry.py), and
# the host-smoke job tests the published stack on a real runner host
# with user defaults (overlay, cgroup v2, rootless networking).
name: repo-health

on:
  schedule:
    - cron: "0 12 * * *" # daily, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ubuntu: ${{ steps.cfg.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: cfg
        run: |
          echo "ubuntu=$(python3 -c "import json; print(json.dumps(json.load(open('ubuntu-versions.json'))['releases']))")" >> "$GITHUB_OUTPUT"

  # Index completeness for every suite x arch, on the host: cheap,
  # and it is the direct regression test for the gutted-index bug.
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_live_repo.py

  # Signing subkey expiry: warn at 60 days, escalate at 30, via a
  # tracking issue (the script files/updates/closes it). The subkey
  # rotated 2026-10-03 expires 2027-10-03; without this, the first
  # symptom of expiry would be every publish failing at export.
  key-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check signing subkey expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_key_expiry.py --file-issue

  # Host-level smoke of the published stack: NO job container, so
  # podman runs with the defaults a user on a real machine gets:
  # overlay storage driver, real cgroup v2 delegation, and rootless
  # networking through pasta. The nested-container jobs cannot test
  # any of those three (vfs + --cgroups=disabled + masked /proc/sys).
  # The runner host is Ubuntu 24.04; the stable track is the cell.
  host-smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install from the live repository (README recipe, host)
        run: sudo bash scripts/install_published.sh stable 24.04
      - name: Assert the installed podman version
        run: |
          EXPECTED=$(python3 -c "import json; print(json.load(open('versions.json'))['stable'])")
          podman --version | grep -F "version $EXPECTED"
      - name: Reset the runner image's baked-in podman storage state
        run: |
          # Same baked-in podman 4.9 storage state as in orchestrate's
          # verify-published-host: podman 6 refuses the mismatched db
          # ("database graph driver \"\" does not match our graph
          # driver \"vfs\""), and vfs is not the user default this job
          # exists to test. Remove both so the freshly installed
          # podman creates storage with its real default driver; the
          # smoke asserts that driver is overlay.
          sudo cat /etc/containers/storage.conf 2>/dev/null || true
          sudo rm -rf /var/lib/containers/storage
          sudo rm -f /etc/containers/storage.conf
      - name: Host smoke (overlay, cgroup v2, rootless networking)
        run: |
          # pasta (rootless networking) needs the tun device; the
          # runner's smokeuser is not in the tun group.
          sudo chmod 0666 /dev/net/tun || true
          sudo env SMOKE_HOST=1 bash scripts/smoke_test.sh

  # Full install + deep smoke from the live repo in clean containers,
  # using the documented README recipe (install_published.sh).
  install:
    needs: setup
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ${{ fromJSON(needs.setup.outputs.ubuntu) }}
        track: [stable, v5, nightly]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ubuntu:${{ matrix.ubuntu_version }}
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install from the live repository (README recipe)
        run: bash scripts/install_published.sh "${{ matrix.track }}" "${{ matrix.ubuntu_version }}"
      - name: Assert the installed podman version (stable/v5)
        if: matrix.track != 'nightly'
        run: |
          # The minimal 26.04 container has no python3 (older releases
          # got it transitively); install it for this step.
          apt-get install -y -qq python3
          EXPECTED=$(python3 -c "import json; print(json.load(open('versions.json'))['${{ matrix.track }}'])")
          podman --version | grep -F "version $EXPECTED"
      - name: Deep smoke on the published stack
        run: bash scripts/smoke_test.sh
