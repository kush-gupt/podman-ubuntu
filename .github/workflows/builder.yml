# Build and push the toolchain Containerfile images to GHCR.
# One image per supported Ubuntu release; rebuilt weekly and on Containerfile change.
name: builder-images

on:
  push:
    paths: ["images/**"]
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          MATRIX=$(python3 -c "
          import json
          releases = json.load(open('ubuntu-versions.json'))['releases']
          print(json.dumps({'ubuntu_version': releases}))
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ${{ fromJSON(needs.setup.outputs.matrix).ubuntu_version }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: images
          file: images/builder.Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/podman-ubuntu-builder:${{ matrix.ubuntu_version }}-${{ matrix.arch }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
