# Build and push the toolchain Containerfile images to GHCR.
# One image per supported Ubuntu release; rebuilt weekly and on Containerfile change.
name: builder-images

on:
  push:
    paths: ["images/**"]
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: set
        # Suite list comes from the shared matrix script, so the supported
        # Ubuntu releases are defined in exactly one place.
        run: |
          echo "matrix=$(python3 scripts/build_matrix.py --suites)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ${{ fromJSON(needs.setup.outputs.matrix).ubuntu }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images
          file: images/builder.Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/podman-ubuntu-builder:${{ matrix.ubuntu_version }}-${{ matrix.arch }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
