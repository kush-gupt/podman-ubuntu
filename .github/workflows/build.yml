# Reusable: build ONE component for ONE (ubuntu, arch, track) cell.
# Runs inside the pre-baked toolchain image; builds a real source package
# with sbuild in unshare mode, gates on lintian, uploads debs + dsc.
name: build-component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      ubuntu_version:
        required: true
        type: string
      arch:
        required: true
        type: string
      track:
        required: true
        type: string
      extra:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/podman-ubuntu-builder:${{ inputs.ubuntu_version }}-${{ inputs.arch }}
    outputs:
      skipped: ${{ steps.skipcheck.outputs.skipped }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Skip if already published
        id: skipcheck
        run: |
          if python3 scripts/is_built.py \
              --component "${{ inputs.component }}" \
              --version "${{ inputs.version }}"; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point dependency caches at the workspace
        if: steps.skipcheck.outputs.skipped != 'true'
        run: |
          # actions/cache runs on the host runner, but the toolchain runs
          # inside the build container. The workspace is bind-mounted at the
          # same files on both sides, so workspace-relative cache homes are
          # the only locations the two agree on. (The old ~/.cargo etc. paths
          # silently cached nothing: ~ resolved to the host runner's home,
          # while the build actually uses /root/.cargo and /github/home.)
          # $GITHUB_WORKSPACE here is the container-side path (/__w/...).
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.ci-cache/cargo" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$GITHUB_WORKSPACE/.ci-cache/gomod" >> "$GITHUB_ENV"
          echo "GOCACHE=$GITHUB_WORKSPACE/.ci-cache/gobuild" >> "$GITHUB_ENV"

      - name: Restore cargo registry cache
        if: steps.skipcheck.outputs.skipped != 'true' && (inputs.component == 'netavark' || inputs.component == 'aardvark-dns')
        uses: actions/cache@v5
        with:
          # Relative paths resolve against the host-side workspace, which is
          # the same bind mount the container wrote to above.
          path: .ci-cache/cargo
          # The registry is pure downloaded sources: identical for every arch
          # and Ubuntu version, so one shared key serves all cells. Stale
          # restores are safe (cargo verifies checksums against Cargo.lock).
          key: cargo-registry-${{ hashFiles('packaging/components.json') }}
          restore-keys: |
            cargo-registry-

      - name: Restore Go module and build caches
        if: steps.skipcheck.outputs.skipped != 'true' && inputs.component == 'podman'
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/gomod
            .ci-cache/gobuild
          # Module cache is arch-independent sources; the build cache is
          # content-keyed by Go itself, so sharing one key across cells is
          # safe and maximizes hits.
          key: go-${{ hashFiles('packaging/components.json') }}
          restore-keys: |
            go-

      - name: Prepare source package
        if: steps.skipcheck.outputs.skipped != 'true'
        run: |
          bash scripts/prepare-source.sh \
            "${{ inputs.component }}" \
            "${{ inputs.version }}" \
            "${{ inputs.ubuntu_version }}" \
            "${{ inputs.extra }}"

      - name: Build binary packages
        if: steps.skipcheck.outputs.skipped != 'true'
        # -d: skip build-dep check. The container IS the controlled build
        # environment (toolchain from upstream, not distro packages, so the
        # dpkg database can't satisfy golang-go/cargo/rustc). Build-Depends
        # stay accurate for a future Debian-proper upload.
        # nocheck: upstream test suites need a container runtime (runc) that
        # isn't available in the build environment; smoke tests run separately
        # in the orchestrate workflow's smoke job.
        # noddebsym: skip -dbgsym packages (not needed for our APT repo).
        env:
          DEB_BUILD_OPTIONS: nocheck noddebsym
        run: |
          cd "build/src/${{ inputs.component }}-${{ inputs.version }}"
          dpkg-buildpackage -b -uc -us -d

      - name: Collect artifacts
        if: steps.skipcheck.outputs.skipped != 'true'
        run: |
          mv build/src/*.deb build/src/*.buildinfo build/src/*.changes \
            build/artifacts/

      - name: Write artifact metadata sidecar
        if: steps.skipcheck.outputs.skipped != 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
          UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
          ARCH: ${{ inputs.arch }}
        run: |
          # meta.json lets downstream jobs (smoke, publish) select artifacts
          # by structured fields instead of parsing directory names.
          python3 -c "
          import json, os
          meta = {k.lower(): os.environ[k] for k in
                  ('COMPONENT', 'VERSION', 'TRACK', 'UBUNTU_VERSION', 'ARCH')}
          meta['ubuntu'] = meta.pop('ubuntu_version')
          json.dump(meta, open('build/artifacts/meta.json', 'w'), indent=2)
          "

      - name: Lintian gate
        if: steps.skipcheck.outputs.skipped != 'true'
        run: |
          # Skip *_source.changes (native packages like podman-suite); lintian
          # can't process them without the .tar.xz.
          rm -f build/artifacts/*_source.changes
          lintian --fail-on error --tag-display-limit 0 build/artifacts/*.changes

      - name: Upload artifacts
        if: steps.skipcheck.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ inputs.component }}-${{ inputs.version }}-${{ inputs.track }}-u${{ inputs.ubuntu_version }}-${{ inputs.arch }}
          path: |
            build/artifacts/*.deb
            build/artifacts/*.dsc
            build/artifacts/*.buildinfo
            build/artifacts/*.changes
            build/artifacts/meta.json
          retention-days: 7
