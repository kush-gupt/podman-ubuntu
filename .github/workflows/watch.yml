# Watch upstream Podman releases and the Ubuntu support calendar.
# Opens a PR for every new release / support-set change. Never builds.
name: watch-upstream

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; podman ships ~monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for new releases and Ubuntu set changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_releases.py

      - name: Push update branch
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: watch/${{ steps.check.outputs.stamp }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          # Push the branch; a separate cron creates the PR via API
          # (GITHUB_TOKEN cannot create PRs in this repo's Actions context).
          git config user.name "podman-ubuntu-bot"
          git config user.email "podman-ubuntu-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add versions.json ubuntu-versions.json
          git commit -m "chore(watch): $SUMMARY"
          git push -u origin "$BRANCH"
          echo "Pushed $BRANCH; PR will be created by the watch-pr cron."
