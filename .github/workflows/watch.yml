# Watch upstream Podman releases and the Ubuntu support calendar.
# Opens a PR for every new release / support-set change. Never builds.
name: watch-upstream

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; podman ships ~monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for new releases and Ubuntu set changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_releases.py

      - name: Open update PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="watch/${{ steps.check.outputs.stamp }}"
          export WATCH_BRANCH="$BRANCH"
          # Check for existing open PR via API (gh pr create is flaky in Actions;
          # use the REST API directly for reliability).
          EXISTING=$(python3 -c "
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          branch = os.environ['WATCH_BRANCH']
          q = branch.replace('/', '%2F')
          req = urllib.request.Request(
              f'https://api.github.com/repos/kush-gupt/podman-ubuntu/pulls?state=open&head=kush-gupt:{q}',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              prs = json.load(r)
          print(len(prs))
          ")
          if [ "$EXISTING" != "0" ]; then
            echo "PR already open for $BRANCH, skipping duplicate."
            exit 0
          fi
          git config user.name "podman-ubuntu-bot"
          git config user.email "podman-ubuntu-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add versions.json ubuntu-versions.json
          git commit -m "chore(watch): ${{ steps.check.outputs.summary }}"
          git push -u origin "$BRANCH"
          python3 -c "
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          branch = os.environ['WATCH_BRANCH']
          body = open('/tmp/watch-pr-body.md').read()
          data = json.dumps({
              'title': 'chore(watch): ${{ steps.check.outputs.summary }}',
              'head': branch,
              'base': 'main',
              'body': body,
          }).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/kush-gupt/podman-ubuntu/pulls',
              data=data, method='POST',
              headers={'Authorization': f'Bearer {token}',
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              pr = json.load(r)
          print('Created PR #' + str(pr['number']) + ': ' + pr['html_url'])
          "
