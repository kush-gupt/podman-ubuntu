version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/images"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      all-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
